name: Release

# Triggers when scripts/release.sh pushes a vX.Y.Z tag. The publish
# job pulls the matching ## [X.Y.Z] section out of CHANGELOG.md and
# creates a GitHub Release page with it. The release is marked
# "Latest" iff this is the highest semver tag in the repo (skips for
# backported patches to old major lines).
#
# The publish job is GATED on `build` and `test` succeeding against
# the exact tagged commit. Previously the release page got published
# in parallel with the main-branch build pipeline — which meant a
# tag could ship even when the production build failed (it did, on
# v2.5.0 first try). Recovering from a published-but-broken release
# is tedious (delete the release, retag the fixed commit, force-push);
# never publishing in the first place is much cleaner.
#
# Recovering from a failed run (or amending an already-published
# tag): amend the tagged commit with the fix, move the tag with
# `git tag -f`, force-push main + the tag. release.yml re-fires;
# the publish step is idempotent (creates the release if missing,
# edits notes/title in place if it already exists), so a re-tagged
# commit cleanly overwrites the existing release page.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # Mirrors build.yml — production build of the tagged commit.
  # Inlined rather than reused-via-workflow_call so each job stays
  # readable in isolation; build.yml itself is skipped on tag pushes
  # (its trigger has tags-ignore), so this is the only build that
  # runs for the tag.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  # Mirrors test.yml — vitest across both workspaces.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          esc="${ver//./\\.}"
          awk "/^## \\[${esc}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > /tmp/notes.md
          if [[ ! -s /tmp/notes.md ]]; then
            echo "::error::No '## [${ver}]' section found in CHANGELOG.md"
            exit 1
          fi
          # Use the tag itself as the release title; subtitle lives in
          # the body. Keeps automation self-contained — no parsing of
          # subtitles out of headers.
          echo "title=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Decide whether this is the latest release
        id: latest
        run: |
          set -euo pipefail
          highest=$(git tag -l 'v*.*.*' | sort -V | tail -1)
          if [[ "${GITHUB_REF_NAME}" == "$highest" ]]; then
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent: `gh release create` fails 422 if the tag was
        # amended + force-pushed (release page already exists from
        # the previous run). When that happens we update notes +
        # title in place via `gh release edit` instead. Both
        # branches honor --latest so the "Latest" pointer stays
        # consistent if a higher tag has appeared since.
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — editing in place."
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${{ steps.notes.outputs.title }}" \
              --notes-file /tmp/notes.md \
              ${{ steps.latest.outputs.flag }}
          else
            echo "Release ${GITHUB_REF_NAME} does not exist — creating."
            gh release create "${GITHUB_REF_NAME}" \
              --title "${{ steps.notes.outputs.title }}" \
              --notes-file /tmp/notes.md \
              ${{ steps.latest.outputs.flag }}
          fi
