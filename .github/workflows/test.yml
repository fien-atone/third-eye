name: Test

# Vitest suite across both workspaces. Tier 1 coverage as of v2.4.1:
#   server/lib/claude-paths       — env-var priority chain, OS branches.
#   server/lib/agent-sessions     — JSONL parser, role detection,
#                                   resilience to corrupt meta files.
#   client/src/lib/semver         — version comparison for the
#                                   "new version available" pill.
#
# Coverage will grow file-by-file as we touch fragile code (parsers,
# pricing math, timezone handling). The bar is "tests for code that
# can silently break"; we don't chase a global coverage percentage.

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
